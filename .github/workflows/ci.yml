name: CI

on:
  push:
    branches: [main, feature/document-images]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests and production build
        run: npm run test
      - name: Dependency audit
        run: npm run audit

  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Parse PowerShell deployment scripts
        shell: powershell
        run: |
          $allErrors = @()
          Get-ChildItem -LiteralPath scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            foreach ($parseError in $parseErrors) {
              $allErrors += "$($_.Name):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Tests and production build
        run: npm run test
